<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SMART NOTES</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5" id="metaThemeColor">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body, header, div, input, textarea, select, button, span, main {
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }
    .text-sm-custom { font-size: var(--note-font-size, 0.875rem); }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 flex flex-col h-screen overflow-hidden select-none" id="appBody" style="--note-font-size: 0.875rem;">

  <!-- App Lock Screen Overlay -->
  <div id="lockScreen" class="fixed inset-0 bg-slate-950 z-50 hidden flex flex-col items-center justify-center p-6 text-center">
    <div class="bg-indigo-600 text-white p-4 rounded-3xl shadow-xl shadow-indigo-600/30 mb-4 animate-bounce">
      <i class="fa-solid fa-lock text-3xl"></i>
    </div>
    <h2 class="text-xl font-bold mb-2">SMART NOTES is Locked</h2>
    <p class="text-xs text-slate-400 mb-6">Enter your 4-digit security PIN to unlock</p>
    <div class="flex space-x-3 mb-6">
      <input type="password" maxlength="1" id="p1" class="w-12 h-14 bg-slate-900 border border-slate-800 rounded-2xl text-center text-xl font-bold focus:border-indigo-500 focus:outline-none" oninput="this.nextElementSibling?.focus()">
      <input type="password" maxlength="1" id="p2" class="w-12 h-14 bg-slate-900 border border-slate-800 rounded-2xl text-center text-xl font-bold focus:border-indigo-500 focus:outline-none" oninput="this.nextElementSibling?.focus()">
      <input type="password" maxlength="1" id="p3" class="w-12 h-14 bg-slate-900 border border-slate-800 rounded-2xl text-center text-xl font-bold focus:border-indigo-500 focus:outline-none" oninput="this.nextElementSibling?.focus()">
      <input type="password" maxlength="1" id="p4" class="w-12 h-14 bg-slate-900 border border-slate-800 rounded-2xl text-center text-xl font-bold focus:border-indigo-500 focus:outline-none" oninput="verifyPin()">
    </div>
    <button onclick="clearPinSetup()" class="text-xs text-slate-500 hover:text-slate-400">Forgot PIN? Reset App Data</button>
  </div>

  <!-- Top Header -->
  <header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-4 py-3 flex items-center justify-between z-10 shadow-sm">
    <div class="flex items-center space-x-2">
      <div id="appLogoBadge" class="bg-indigo-600 text-white p-2 rounded-xl shadow-lg shadow-indigo-500/30">
        <i class="fa-solid fa-brain text-lg"></i>
      </div>
      <h1 id="appTitleText" class="font-bold text-lg tracking-wider text-indigo-600 dark:text-indigo-400">SMART NOTES</h1>
    </div>
    <div class="flex items-center space-x-1.5 sm:space-x-2">
      <!-- Quick Scratchpad Toggle -->
      <button onclick="toggleScratchpad()" class="bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 p-2.5 rounded-xl text-slate-700 dark:text-slate-300 text-sm" title="Quick Scratchpad">
        <i class="fa-solid fa-note-sticky"></i>
      </button>
      <!-- Theme Switcher -->
      <button onclick="toggleTheme()" class="bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 p-2.5 rounded-xl text-slate-700 dark:text-slate-300 text-sm" title="Toggle Theme">
        <i id="themeIcon" class="fa-solid fa-moon"></i>
      </button>
      <!-- Settings Menu Dropdown -->
      <div class="relative">
        <button onclick="toggleSettingsMenu()" class="bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 p-2.5 rounded-xl text-slate-700 dark:text-slate-300 text-sm" title="Settings">
          <i class="fa-solid fa-gear"></i>
        </button>
        <div id="settingsDropdown" class="absolute right-0 mt-2 w-56 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-xl hidden z-30 p-2 space-y-1 text-xs">
          <div class="px-3 py-2 font-semibold text-slate-400 uppercase tracking-wider text-[10px]">Preferences</div>
          <button onclick="promptSetPin()" class="w-full text-left px-3 py-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl flex items-center space-x-2"><i class="fa-solid fa-lock w-4"></i><span>Set App PIN Lock</span></button>
          <button onclick="cycleFontSize()" class="w-full text-left px-3 py-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl flex items-center space-x-2"><i class="fa-solid fa-font w-4"></i><span>Font Size: <span id="fontSizeLabel">Normal</span></span></button>
          <button onclick="cycleAccentColor()" class="w-full text-left px-3 py-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl flex items-center space-x-2"><i class="fa-solid fa-palette w-4"></i><span>Theme Color</span></button>
          <div class="border-t border-slate-200 dark:border-slate-800 my-1"></div>
          <label class="w-full text-left px-3 py-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl flex items-center space-x-2 cursor-pointer">
            <i class="fa-solid fa-upload w-4"></i><span>Import Backup JSON</span>
            <input type="file" accept=".json" onchange="importNotes(event)" class="hidden">
          </label>
          <button onclick="exportNotes()" class="w-full text-left px-3 py-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl flex items-center space-x-2"><i class="fa-solid fa-download w-4"></i><span>Export Backup JSON</span></button>
          <button onclick="showStorageStats()" class="w-full text-left px-3 py-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl flex items-center space-x-2"><i class="fa-solid fa-database w-4"></i><span>Storage Usage</span></button>
        </div>
      </div>
      <button onclick="openNoteModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3.5 py-2 rounded-xl font-medium text-sm flex items-center space-x-1.5 shadow-md shadow-indigo-600/30">
        <i class="fa-solid fa-plus"></i>
        <span>New</span>
      </button>
    </div>
  </header>

  <!-- Navigation Views Tabs -->
  <div class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-4 flex space-x-4 text-sm font-medium overflow-x-auto">
    <button onclick="switchTab('notes')" id="tabNotes" class="py-2.5 border-b-2 border-indigo-600 text-indigo-600 dark:text-indigo-400 whitespace-nowrap">Notes</button>
    <button onclick="switchTab('favorites')" id="tabFavorites" class="py-2.5 border-b-2 border-transparent text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 whitespace-nowrap">Favorites ⭐</button>
    <button onclick="switchTab('todos')" id="tabTodos" class="py-2.5 border-b-2 border-transparent text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 whitespace-nowrap">To-Do Hub</button>
    <button onclick="switchTab('archive')" id="tabArchive" class="py-2.5 border-b-2 border-transparent text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 whitespace-nowrap">Archive</button>
    <button onclick="switchTab('trash')" id="tabTrash" class="py-2.5 border-b-2 border-transparent text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 whitespace-nowrap">Trash 🗑️</button>
  </div>

  <!-- Search, Filter & Bulk Bar -->
  <div class="bg-slate-100/70 dark:bg-slate-900/50 px-4 py-2.5 border-b border-slate-200 dark:border-slate-800 space-y-2">
    <div class="flex items-center space-x-2">
      <div class="relative flex-1">
        <i class="fa-solid fa-search absolute left-3 top-3 text-slate-400 text-sm"></i>
        <input type="text" id="searchInput" oninput="filterContent()" placeholder="Search title or content..." 
          class="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl pl-9 pr-4 py-2 text-sm focus:outline-none focus:border-indigo-500 text-slate-900 dark:text-slate-200 shadow-sm">
      </div>
      <select id="tagFilter" onchange="filterContent()" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-700 dark:text-slate-300 focus:outline-none focus:border-indigo-500 shadow-sm">
        <option value="">All Tags</option>
        <option value="Personal">Personal</option>
        <option value="Work">Work</option>
        <option value="Ideas">Ideas</option>
        <option value="Important">Important</option>
      </select>
    </div>
    <div class="flex items-center justify-between text-xs text-slate-500 px-1">
      <span id="itemCount">0 items saved</span>
      <div class="flex items-center space-x-3">
        <button onclick="toggleSortOrder()" id="sortBtn" class="hover:text-indigo-600 dark:hover:text-indigo-400 flex items-center space-x-1">
          <i class="fa-solid fa-arrow-down-wide-short"></i>
          <span id="sortLabel">Newest</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Main Container -->
  <main class="flex-1 overflow-y-auto p-4 space-y-3 text-sm-custom" id="mainContainer">
    <!-- Dynamic content renders here -->
  </main>

  <!-- Empty State -->
  <div id="emptyState" class="hidden flex-1 flex flex-col items-center justify-center p-6 text-center text-slate-400 dark:text-slate-500">
    <i class="fa-regular fa-note-sticky text-5xl mb-3 text-slate-300 dark:text-slate-600"></i>
    <p class="text-base font-medium" id="emptyTitle">No notes found</p>
    <p class="text-xs text-slate-400 dark:text-slate-600 mt-1">Tap the 'New' button to create your entry.</p>
  </div>

  <!-- Quick Scratchpad Drawer -->
  <div id="scratchpadDrawer" class="fixed inset-x-0 bottom-0 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 p-4 shadow-2xl z-40 transform translate-y-full transition-transform duration-200">
    <div class="flex justify-between items-center mb-2">
      <h3 class="font-bold text-sm text-indigo-600 dark:text-indigo-400"><i class="fa-solid fa-note-sticky mr-1.5"></i> Quick Scratchpad</h3>
      <button onclick="toggleScratchpad()" class="text-slate-400 hover:text-slate-600 dark:hover:text-white p-1"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <textarea id="scratchpadInput" rows="4" placeholder="Jot temporary notes here instantly..." oninput="saveScratchpad()"
      class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-500 resize-none"></textarea>
  </div>

  <!-- Note Add/Edit Modal -->
  <div id="noteModal" class="fixed inset-0 bg-slate-950/60 dark:bg-slate-950/80 backdrop-blur-sm z-50 hidden flex flex-col justify-end sm:justify-center sm:items-center p-0 sm:p-4">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 w-full sm:max-w-lg rounded-t-3xl sm:rounded-2xl p-5 flex flex-col max-h-[90vh] shadow-2xl animate-in slide-in-from-bottom duration-200">
      <div class="flex justify-between items-center mb-3">
        <h2 id="modalTitle" class="font-bold text-lg text-indigo-600 dark:text-indigo-400">New Smart Note</h2>
        <button onclick="closeNoteModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-white p-2">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      
      <input type="hidden" id="noteId">
      
      <div class="space-y-3 flex-1 overflow-y-auto pr-1">
        <div>
          <label class="text-xs text-slate-500 dark:text-slate-400 mb-1 block">Title</label>
          <input type="text" id="noteTitleInput" placeholder="Note Title..." oninput="saveDraft()"
            class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 text-slate-900 dark:text-slate-200 shadow-sm">
        </div>

        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="text-xs text-slate-500 dark:text-slate-400">Content / Markdown / Checklists</label>
            <div class="flex space-x-2.5 items-center">
              <button type="button" onclick="togglePreview()" class="text-xs text-indigo-600 dark:text-indigo-400 font-medium" id="previewBtn">Preview</button>
              <button type="button" onclick="transformTextCase('upper')" class="text-xs text-slate-500 hover:text-indigo-500" title="UPPERCASE">AA</button>
              <button type="button" onclick="insertMarkdownSnippet('**', '**')" class="text-xs text-slate-500 font-bold">B</button>
              <button type="button" onclick="startVoiceInput()" class="text-xs text-indigo-600 dark:text-indigo-400 flex items-center space-x-1">
                <i class="fa-solid fa-microphone"></i>
                <span id="micLabel">Voice</span>
              </button>
            </div>
          </div>
          <textarea id="noteContentInput" rows="6" placeholder="Write notes, use Markdown, or bullet lists..." oninput="updateStats(); saveDraft();"
            class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 text-slate-900 dark:text-slate-200 resize-none shadow-sm"></textarea>
          
          <div id="previewBox" class="hidden w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl p-3 text-sm min-h-[140px] max-h-[140px] overflow-y-auto text-slate-700 dark:text-slate-300"></div>
          
          <div class="flex justify-between items-center text-[11px] text-slate-400 mt-1 px-1">
            <span id="editorStats">0 words • 0 chars</span>
            <span id="autoSaveIndicator" class="text-emerald-500 font-medium">All changes saved</span>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs text-slate-500 dark:text-slate-400 mb-1 block">Tag Category</label>
            <select id="noteTagInput" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-700 dark:text-slate-300 focus:outline-none focus:border-indigo-500 shadow-sm">
              <option value="Personal">Personal</option>
              <option value="Work">Work</option>
              <option value="Ideas">Ideas</option>
              <option value="Important">Important</option>
            </select>
          </div>
          <div>
            <label class="text-xs text-slate-500 dark:text-slate-400 mb-1 block">Card Accent Color</label>
            <select id="noteColorInput" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-700 dark:text-slate-300 focus:outline-none focus:border-indigo-500 shadow-sm">
              <option value="default">Default Slate</option>
              <option value="indigo">Indigo Glow</option>
              <option value="emerald">Emerald Green</option>
              <option value="amber">Amber Gold</option>
              <option value="rose">Rose Red</option>
            </select>
          </div>
        </div>
      </div>

      <div class="mt-4 flex space-x-3">
        <button onclick="closeNoteModal()" class="flex-1 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 py-3 rounded-xl font-medium text-sm text-slate-700 dark:text-slate-300">Cancel</button>
        <button onclick="saveNote()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 py-3 rounded-xl font-medium text-sm text-white shadow-lg shadow-indigo-600/30">Save Note</button>
      </div>
    </div>
  </div>

  <!-- Distraction-Free Reader Modal -->
  <div id="readerModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 hidden flex flex-col p-6">
    <div class="flex justify-between items-center mb-4">
      <h2 id="readerTitle" class="font-bold text-xl text-indigo-400"></h2>
      <button onclick="closeReader()" class="bg-slate-900 border border-slate-800 text-white px-3.5 py-2 rounded-xl text-sm"><i class="fa-solid fa-xmark mr-1"></i> Close</button>
    </div>
    <div class="flex-1 bg-slate-900 border border-slate-800 rounded-3xl p-6 overflow-y-auto text-slate-200 text-base leading-relaxed whitespace-pre-wrap" id="readerContent"></div>
    <div class="mt-4 flex justify-end space-x-3">
      <button onclick="printCurrentReaderNote()" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2.5 rounded-xl text-sm font-medium"><i class="fa-solid fa-print mr-1.5"></i> Print / PDF</button>
      <button onclick="exportSingleNote()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2.5 rounded-xl text-sm font-medium"><i class="fa-solid fa-download mr-1.5"></i> Export File</button>
    </div>
  </div>

  <!-- App Script Logic -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => console.log('SW failed:', err));
    }

    let db;
    let notes = [];
    let todos = [];
    let currentTab = 'notes';
    let sortNewest = true;
    let isPreviewing = false;
    let currentReadingNote = null;
    let currentAccent = localStorage.getItem('appAccent') || 'indigo';

    // Theme & Appearance Setup
    applyThemeSettings();

    function applyThemeSettings() {
      if (localStorage.theme === 'light') {
        document.documentElement.classList.remove('dark');
        document.getElementById('themeIcon').className = "fa-solid fa-sun";
        document.getElementById('metaThemeColor').setAttribute('content', '#ffffff');
      } else {
        document.documentElement.classList.add('dark');
        document.getElementById('themeIcon').className = "fa-solid fa-moon";
        document.getElementById('metaThemeColor').setAttribute('content', '#4f46e5');
      }

      // Font size setting
      const fs = localStorage.getItem('fontSize') || '0.875rem';
      document.getElementById('appBody').style.setProperty('--note-font-size', fs);
      const fsLabel = fs === '0.75rem' ? 'Compact' : (fs === '1rem' ? 'Large' : 'Normal');
      document.getElementById('fontSizeLabel').innerText = fsLabel;
    }

    function toggleTheme() {
      if (document.documentElement.classList.contains('dark')) {
        localStorage.theme = 'light';
      } else {
        localStorage.theme = 'dark';
      }
      applyThemeSettings();
    }

    function cycleFontSize() {
      const current = document.getElementById('appBody').style.getPropertyValue('--note-font-size');
      let next = '0.75rem';
      if (current === '0.75rem') next = '0.875rem';
      else if (current === '0.875rem') next = '1rem';
      localStorage.setItem('fontSize', next);
      applyThemeSettings();
    }

    function cycleAccentColor() {
      const accents = ['indigo', 'emerald', 'amber', 'rose'];
      let idx = accents.indexOf(currentAccent) + 1;
      if (idx >= accents.length) idx = 0;
      currentAccent = accents[idx];
      localStorage.setItem('appAccent', currentAccent);
      alert('Accent theme updated! Refresh app to view full color changes.');
    }

    // PIN Security Check
    const storedPin = localStorage.getItem('appPin');
    if (storedPin) {
      document.getElementById('lockScreen').classList.remove('hidden');
    }

    function verifyPin() {
      const p = document.getElementById('p1').value + document.getElementById('p2').value + document.getElementById('p3').value + document.getElementById('p4').value;
      if (p === storedPin) {
        document.getElementById('lockScreen').classList.add('hidden');
      } else {
        alert('Incorrect PIN');
        ['p1','p2','p3','p4'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('p1').focus();
      }
    }

    function promptSetPin() {
      const pin = prompt('Enter a 4-digit security PIN:');
      if (pin && pin.length === 4) {
        localStorage.setItem('appPin', pin);
        alert('PIN Lock enabled successfully!');
      } else if (pin) {
        alert('PIN must be exactly 4 digits.');
      }
    }

    function clearPinSetup() {
      localStorage.removeItem('appPin');
      location.reload();
    }

    // Initialize Database
    const request = indexedDB.open('SmartNotesUltimateDB', 1);
    request.onerror = (e) => console.error('DB error:', e.target.error);
    request.onsuccess = (e) => {
      db = e.target.result;
      loadAllData();
      loadScratchpad();
    };
    request.onupgradeneeded = (e) => {
      const dbInstance = e.target.result;
      if (!dbInstance.objectStoreNames.contains('notes')) {
        dbInstance.createObjectStore('notes', { keyPath: 'id', autoIncrement: true });
      }
      if (!dbInstance.objectStoreNames.contains('todos')) {
        dbInstance.createObjectStore('todos', { keyPath: 'id', autoIncrement: true });
      }
    };

    function loadAllData() {
      const tx = db.transaction(['notes', 'todos'], 'readonly');
      tx.objectStore('notes').getAll().onsuccess = (e) => { notes = e.target.result; };
      tx.objectStore('todos').getAll().onsuccess = (e) => { todos = e.target.result; };
      tx.oncomplete = () => filterContent();
    }

    function switchTab(tab) {
      currentTab = tab;
      ['notes', 'favorites', 'todos', 'archive', 'trash'].forEach(t => {
        const btn = document.getElementById(`tab${t.charAt(0).toUpperCase() + t.slice(1)}`);
        if (btn) {
          if (t === tab) {
            btn.className = "py-2.5 border-b-2 border-indigo-600 text-indigo-600 dark:text-indigo-400 font-semibold whitespace-nowrap";
          } else {
            btn.className = "py-2.5 border-b-2 border-transparent text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 whitespace-nowrap";
          }
        }
      });
      filterContent();
    }

    function toggleSortOrder() {
      sortNewest = !sortNewest;
      document.getElementById('sortLabel').innerText = sortNewest ? 'Newest' : 'Oldest';
      document.getElementById('sortBtn').querySelector('i').className = sortNewest ? "fa-solid fa-arrow-down-wide-short" : "fa-solid fa-arrow-up-wide-short";
      filterContent();
    }

    function filterContent() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const selectedTag = document.getElementById('tagFilter').value;

      if (currentTab === 'todos') {
        renderTodos(todos.filter(t => t.text.toLowerCase().includes(query)));
        return;
      }

      let data = [...notes];
      if (currentTab === 'notes') data = data.filter(n => !n.archived && !n.trashed);
      else if (currentTab === 'favorites') data = data.filter(n => n.favorite && !n.archived && !n.trashed);
      else if (currentTab === 'archive') data = data.filter(n => n.archived && !n.trashed);
      else if (currentTab === 'trash') data = data.filter(n => n.trashed);

      data.sort((a, b) => {
        if (a.pinned !== b.pinned) return b.pinned - a.pinned;
        return sortNewest ? b.date - a.date : a.date - b.date;
      });

      const filtered = data.filter(n => (n.title + ' ' + n.content).toLowerCase().includes(query) && (selectedTag === "" || n.tag === selectedTag));
      renderNotes(filtered);
    }

    function renderNotes(data) {
      const container = document.getElementById('mainContainer');
      const emptyState = document.getElementById('emptyState');
      const itemCount = document.getElementById('itemCount');
      container.innerHTML = '';

      itemCount.innerText = `${data.length} item${data.length === 1 ? '' : 's'}`;

      if (data.length === 0) {
        emptyState.classList.remove('hidden');
        document.getElementById('emptyTitle').innerText = `No ${currentTab} items found`;
        return;
      }
      emptyState.classList.add('hidden');

      const searchQuery = document.getElementById('searchInput').value.toLowerCase();

      data.forEach(note => {
        const card = document.createElement('div');
        let accentBorder = "border-slate-200 dark:border-slate-800/80";
        if(note.color === 'indigo') accentBorder = "border-indigo-500/50 bg-indigo-50/10 dark:bg-indigo-950/10";
        if(note.color === 'emerald') accentBorder = "border-emerald-500/50 bg-emerald-50/10 dark:bg-emerald-950/10";
        if(note.color === 'amber') accentBorder = "border-amber-500/50 bg-amber-50/10 dark:bg-amber-950/10";
        if(note.color === 'rose') accentBorder = "border-rose-500/50 bg-rose-50/10 dark:bg-rose-950/10";

        card.className = `bg-white dark:bg-slate-900 border ${accentBorder} rounded-2xl p-4 shadow-sm relative group cursor-pointer`;
        card.onclick = () => openReader(note);

        let tagColor = "bg-indigo-50 dark:bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 border-indigo-200 dark:border-indigo-500/20";
        if(note.tag === 'Work') tagColor = "bg-blue-50 dark:bg-blue-500/10 text-blue-600 dark:text-blue-400 border-blue-200 dark:border-blue-500/20";
        if(note.tag === 'Important') tagColor = "bg-rose-50 dark:bg-rose-500/10 text-rose-600 dark:text-rose-400 border-rose-200 dark:border-rose-500/20";
        if(note.tag === 'Ideas') tagColor = "bg-amber-50 dark:bg-amber-500/10 text-amber-600 dark:text-amber-400 border-amber-200 dark:border-amber-500/20";

        const words = note.content ? note.content.trim().split(/\s+/).length : 0;
        
        let displayTitle = escapeHTML(note.title || 'Untitled');
        let displayContent = escapeHTML(note.content);

        card.innerHTML = `
          <div class="flex justify-between items-start mb-2" onclick="event.stopPropagation()">
            <div class="flex items-center space-x-2 truncate pr-2">
              ${note.pinned ? '<i class="fa-solid fa-thumbtack text-indigo-500 text-xs"></i>' : ''}
              <h3 class="font-semibold text-slate-900 dark:text-slate-100 text-base truncate">${displayTitle}</h3>
            </div>
            <span class="text-[10px] px-2 py-0.5 rounded-full border ${tagColor} font-medium">${note.tag}</span>
          </div>
          <p class="text-slate-600 dark:text-slate-400 text-sm line-clamp-2 mb-3 whitespace-pre-wrap">${displayContent}</p>
          <div class="flex justify-between items-center pt-2 border-t border-slate-100 dark:border-slate-800/60 text-xs text-slate-400 dark:text-slate-500" onclick="event.stopPropagation()">
            <div class="flex items-center space-x-2">
              <span>${new Date(note.date).toLocaleDateString(undefined, {month: 'short', day: 'numeric'})}</span>
              <span>•</span>
              <span>${words} words</span>
            </div>
            <div class="flex space-x-2.5">
              ${!note.trashed ? `
                <button onclick="toggleFavorite(${note.id})" class="hover:text-amber-500 p-1 ${note.favorite ? 'text-amber-500' : ''}" title="Favorite"><i class="fa-solid fa-star"></i></button>
                <button onclick="togglePin(${note.id})" class="hover:text-indigo-600 dark:hover:text-indigo-400 p-1" title="Pin"><i class="fa-solid fa-thumbtack"></i></button>
                <button onclick="cloneNote(${note.id})" class="hover:text-indigo-600 dark:hover:text-indigo-400 p-1" title="Clone"><i class="fa-solid fa-clone"></i></button>
                <button onclick="archiveNote(${note.id}, ${!note.archived})" class="hover:text-amber-600 dark:hover:text-amber-400 p-1" title="Archive"><i class="fa-solid fa-box-archive"></i></button>
                <button onclick="editNote(${note.id})" class="hover:text-indigo-600 dark:hover:text-indigo-400 p-1" title="Edit"><i class="fa-solid fa-pen"></i></button>
                <button onclick="moveToTrash(${note.id})" class="hover:text-rose-600 dark:hover:text-rose-400 p-1" title="Delete"><i class="fa-solid fa-trash"></i></button>
              ` : `
                <button onclick="restoreFromTrash(${note.id})" class="hover:text-emerald-500 p-1" title="Restore"><i class="fa-solid fa-rotate-left"></i></button>
                <button onclick="deleteForever(${note.id})" class="hover:text-rose-500 p-1" title="Delete Forever"><i class="fa-solid fa-trash-can"></i></button>
              `}
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderTodos(data) {
      const container = document.getElementById('mainContainer');
      const emptyState = document.getElementById('emptyState');
      const itemCount = document.getElementById('itemCount');
      container.innerHTML = '';
      itemCount.innerText = `${data.length} task${data.length === 1 ? '' : 's'}`;

      const inputBar = document.createElement('div');
      inputBar.className = "bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-3 shadow-sm flex items-center space-x-2 mb-3";
      inputBar.innerHTML = `
        <input type="text" id="newTodoInput" placeholder="Add a quick task..." 
          class="flex-1 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 text-slate-900 dark:text-slate-200">
        <button onclick="addTodoItem()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-sm font-medium shadow-md shadow-indigo-600/30">Add</button>
      `;
      container.appendChild(inputBar);

      data.forEach(todo => {
        const item = document.createElement('div');
        item.className = "bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-3.5 shadow-sm flex items-center justify-between";
        item.innerHTML = `
          <label class="flex items-center space-x-3 flex-1 cursor-pointer pr-2">
            <input type="checkbox" ${todo.completed ? 'checked' : ''} onchange="toggleTodo(${todo.id})" class="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500 accent-indigo-600">
            <span class="text-sm ${todo.completed ? 'line-through text-slate-400 dark:text-slate-500' : 'text-slate-800 dark:text-slate-200'}">${escapeHTML(todo.text)}</span>
          </label>
          <button onclick="deleteTodo(${todo.id})" class="text-slate-400 hover:text-rose-500 p-1"><i class="fa-solid fa-trash text-xs"></i></button>
        `;
        container.appendChild(item);
      });
    }

    // Modal & Note CRUD
    function openNoteModal(id = null) {
      document.getElementById('noteModal').classList.remove('hidden');
      if (id) {
        document.getElementById('modalTitle').innerText = 'Edit Note';
        const note = notes.find(n => n.id === id);
        if (note) {
          document.getElementById('noteId').value = note.id;
          document.getElementById('noteTitleInput').value = note.title;
          document.getElementById('noteContentInput').value = note.content;
          document.getElementById('noteTagInput').value = note.tag;
          document.getElementById('noteColorInput').value = note.color || 'default';
        }
      } else {
        document.getElementById('modalTitle').innerText = 'New Smart Note';
        document.getElementById('noteId').value = '';
        document.getElementById('noteTitleInput').value = '';
        document.getElementById('noteContentInput').value = '';
        document.getElementById('noteTagInput').value = 'Personal';
        document.getElementById('noteColorInput').value = 'default';
      }
      updateStats();
    }

    function closeNoteModal() {
      document.getElementById('noteModal').classList.add('hidden');
      localStorage.removeItem('smartNotesDraft');
    }

    function saveDraft() {
      const title = document.getElementById('noteTitleInput').value;
      const content = document.getElementById('noteContentInput').value;
      localStorage.setItem('smartNotesDraft', JSON.stringify({title, content}));
      document.getElementById('autoSaveIndicator').innerText = 'Saved ✓';
    }

    function updateStats() {
      const content = document.getElementById('noteContentInput').value;
      const words = content ? content.trim().split(/\s+/).length : 0;
      const chars = content.length;
      document.getElementById('editorStats').innerText = `${words} words • ${chars} chars`;
    }

    function saveNote() {
      const id = document.getElementById('noteId').value;
      const title = document.getElementById('noteTitleInput').value.trim();
      const content = document.getElementById('noteContentInput').value.trim();
      const tag = document.getElementById('noteTagInput').value;
      const color = document.getElementById('noteColorInput').value;

      if (!title && !content) return;

      const transaction = db.transaction(['notes'], 'readwrite');
      const store = transaction.objectStore('notes');
      const existing = id ? notes.find(n => n.id === Number(id)) : null;

      const noteObject = {
        title,
        content,
        tag,
        color,
        pinned: existing ? existing.pinned : false,
        favorite: existing ? existing.favorite : false,
        archived: existing ? existing.archived : false,
        trashed: existing ? existing.trashed : false,
        date: new Date().getTime()
      };

      if (id) {
        noteObject.id = Number(id);
        store.put(noteObject);
      } else {
        store.add(noteObject);
      }

      transaction.oncomplete = () => {
        localStorage.removeItem('smartNotesDraft');
        closeNoteModal();
        loadAllData();
      };
    }

    function editNote(id) { openNoteModal(id); }

    function cloneNote(id) {
      const note = notes.find(n => n.id === id);
      if (note) {
        const tx = db.transaction(['notes'], 'readwrite');
        tx.objectStore('notes').add({ ...note, title: `${note.title} (Copy)`, id: undefined, date: new Date().getTime() });
        tx.oncomplete = () => loadAllData();
      }
    }

    function togglePin(id) {
      const note = notes.find(n => n.id === id);
      if (note) {
        note.pinned = !note.pinned;
        const tx = db.transaction(['notes'], 'readwrite');
        tx.objectStore('notes').put(note);
        tx.oncomplete = () => loadAllData();
      }
    }

    function toggleFavorite(id) {
      const note = notes.find(n => n.id === id);
      if (note) {
        note.favorite = !note.favorite;
        const tx = db.transaction(['notes'], 'readwrite');
        tx.objectStore('notes').put(note);
        tx.oncomplete = () => loadAllData();
      }
    }

    function archiveNote(id, status) {
      const note = notes.find(n => n.id === id);
      if (note) {
        note.archived = status;
        const tx = db.transaction(['notes'], 'readwrite');
        tx.objectStore('notes').put(note);
        tx.oncomplete = () => loadAllData();
      }
    }

    function moveToTrash(id) {
      const note = notes.find(n => n.id === id);
      if (note) {
        note.trashed = true;
        const tx = db.transaction(['notes'], 'readwrite');
        tx.objectStore('notes').put(note);
        tx.oncomplete = () => loadAllData();
      }
    }

    function restoreFromTrash(id) {
      const note = notes.find(n => n.id === id);
      if (note) {
        note.trashed = false;
        const tx = db.transaction(['notes'], 'readwrite');
        tx.objectStore('notes').put(note);
        tx.oncomplete = () => loadAllData();
      }
    }

    function deleteForever(id) {
      if (confirm('Permanently delete this note?')) {
        const tx = db.transaction(['notes'], 'readwrite');
        tx.objectStore('notes').delete(id);
        tx.oncomplete = () => loadAllData();
      }
    }

    // Reader Mode & Export
    function openReader(note) {
      currentReadingNote = note;
      document.getElementById('readerTitle').innerText = note.title || 'Untitled Note';
      document.getElementById('readerContent').innerHTML = escapeHTML(note.content).replace(/\[ \]/g, '<i class="fa-regular fa-square mr-2"></i>').replace(/\[x\]/g, '<i class="fa-regular fa-square-check text-indigo-400 mr-2"></i>');
      document.getElementById('readerModal').classList.remove('hidden');
    }

    function closeReader() {
      document.getElementById('readerModal').classList.add('hidden');
    }

    function printCurrentReaderNote() {
      if (!currentReadingNote) return;
      const w = window.open('', '_blank');
      w.document.write(`<html><head><title>${currentReadingNote.title}</title></head><body style="font-family:sans-serif;padding:40px;"><h1>${currentReadingNote.title}</h1><pre>${currentReadingNote.content}</pre></body></html>`);
      w.print();
    }

    function exportSingleNote() {
      if (!currentReadingNote) return;
      const dataStr = "data:text/plain;charset=utf-8," + encodeURIComponent(currentReadingNote.content);
      const dl = document.createElement('a');
      dl.setAttribute("href", dataStr);
      dl.setAttribute("download", `${currentReadingNote.title || 'note'}.txt`);
      document.body.appendChild(dl);
      dl.click();
      dl.remove();
    }

    // Scratchpad Drawer
    function toggleScratchpad() {
      const drawer = document.getElementById('scratchpadDrawer');
      drawer.classList.toggle('translate-y-full');
    }

    function saveScratchpad() {
      localStorage.setItem('quickScratchpad', document.getElementById('scratchpadInput').value);
    }

    function loadScratchpad() {
      const val = localStorage.getItem('quickScratchpad');
      if (val) document.getElementById('scratchpadInput').value = val;
    }

    // Settings Dropdown & Storage Stats
    function toggleSettingsMenu() {
      document.getElementById('settingsDropdown').classList.toggle('hidden');
    }

    function showStorageStats() {
      if (navigator.storage && navigator.storage.estimate) {
        navigator.storage.estimate().then(estimate => {
          const usedMB = (estimate.usage / (1024*1024)).toFixed(2);
          alert(`Storage Used: ${usedMB} MB in Local IndexedDB.`);
        });
      } else {
        alert(`Total Saved Notes: ${notes.length} | To-Dos: ${todos.length}`);
      }
    }

    // Todo Hub
    function addTodoItem() {
      const input = document.getElementById('newTodoInput');
      const text = input.value.trim();
      if (!text) return;
      const tx = db.transaction(['todos'], 'readwrite');
      tx.objectStore('todos').add({ text, completed: false, date: new Date().getTime() });
      tx.oncomplete = () => { input.value = ''; loadAllData(); };
    }

    function toggleTodo(id) {
      const todo = todos.find(t => t.id === id);
      if (todo) {
        todo.completed = !todo.completed;
        const tx = db.transaction(['todos'], 'readwrite');
        tx.objectStore('todos').put(todo);
        tx.oncomplete = () => loadAllData();
      }
    }

    function deleteTodo(id) {
      const tx = db.transaction(['todos'], 'readwrite');
      tx.objectStore('todos').delete(id);
      tx.oncomplete = () => loadAllData();
    }

    // Text Formatting & Voice
    function transformTextCase(type) {
      const ta = document.getElementById('noteContentInput');
      if (type === 'upper') ta.value = ta.value.toUpperCase();
      updateStats();
    }

    function togglePreview() {
      isPreviewing = !isPreviewing;
      const textarea = document.getElementById('noteContentInput');
      const previewBox = document.getElementById('previewBox');
      const btn = document.getElementById('previewBtn');

      if (isPreviewing) {
        previewBox.innerHTML = escapeHTML(textarea.value).replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
        textarea.classList.add('hidden');
        previewBox.classList.remove('hidden');
        btn.innerText = 'Edit';
      } else {
        textarea.classList.remove('hidden');
        previewBox.classList.add('hidden');
        btn.innerText = 'Preview';
      }
    }

    function insertMarkdownSnippet(startTag, endTag) {
      if (isPreviewing) return;
      const textarea = document.getElementById('noteContentInput');
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const text = textarea.value;
      textarea.value = text.substring(0, start) + startTag + text.substring(start, end) + endTag + text.substring(end);
      textarea.focus();
      updateStats();
    }

    function startVoiceInput() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) { alert('Voice not supported.'); return; }
      const recognition = new SpeechRecognition();
      const micLabel = document.getElementById('micLabel');
      recognition.onstart = () => micLabel.innerText = 'Listening...';
      recognition.onresult = (e) => {
        document.getElementById('noteContentInput').value += ' ' + e.results[0][0].transcript;
        updateStats();
      };
      recognition.onend = () => micLabel.innerText = 'Voice';
      recognition.start();
    }

    // Backup Export / Import
    function exportNotes() {
      const backup = { notes, todos };
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backup, null, 2));
      const dl = document.createElement('a');
      dl.setAttribute("href", dataStr);
      dl.setAttribute("download", `smart_notes_ultimate_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(dl);
      dl.click();
      dl.remove();
    }

    function importNotes(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          const tx = db.transaction(['notes', 'todos'], 'readwrite');
          if (parsed.notes) parsed.notes.forEach(n => { delete n.id; tx.objectStore('notes').add(n); });
          if (parsed.todos) parsed.todos.forEach(t => { delete t.id; tx.objectStore('todos').add(t); });
          tx.oncomplete = () => { alert('Backup imported!'); loadAllData(); };
        } catch(err) { alert('Invalid file.'); }
      };
      reader.readAsText(file);
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }
  </script>
</body>
</html>
